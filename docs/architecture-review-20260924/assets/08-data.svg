<text x="68" y="863" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155" data-graph-role="label" data-graph-bounds="68.612,848.805,741.234,865.737">来源事实回答“发生过什么”，主张回答“据此认识到什么”，书摘回答“可以采用什么方法”。</text>
<rect x="48" y="931" width="1344" height="92" rx="10" fill="#f8fafc" data-graph-role="decoration"/>

<text x="68" y="993" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155" data-graph-role="label" data-graph-bounds="68.85,978.907,805.4599999999999,994.8530000000001">一条原消息只计一次独立证据；多份人物材料、多个引用、重复检索不能把一次观察变成多次支持。</text>
<text x="48" y="1064" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#64748b" data-graph-role="label" data-graph-bounds="48.465,1051.58,716.9699999999999,1066.415">保留原始来源定位与旧 ID 别名；来源没有稳定 ID 时标明指纹方案与置信边界，绝不静默按文本合并。</text>

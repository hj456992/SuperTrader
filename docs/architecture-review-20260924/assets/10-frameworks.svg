<rect x="48" y="560" width="1344" height="119" rx="10" fill="#f0fdf4" data-graph-role="decoration"/>
<text x="68" y="592" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#16a34a" data-graph-role="label" data-graph-bounds="68.7,575.56,327.08,594.1199999999999">框架共同不能替代的业务责任</text>
<text x="68" y="622" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155" data-graph-role="label" data-graph-bounds="68.714,607.958,856.4599999999998,624.737">谁说过什么、是不是同一个人、哪些证据有效、拒绝是否被尊重、删除如何传播，仍由爱聊领域模型决定。</text>
<text x="68" y="649" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155" data-graph-role="label" data-graph-bounds="68.595,634.958,904.8589999999997,650.853">任务持久化、事务提交与 outbox 需由应用设计；插件事件、SDK 记忆和进程 Future 都不能自动提供这些保证。</text>
<rect x="48" y="745" width="1344" height="119" rx="10" fill="#f8fafc" data-graph-role="decoration"/>
<text x="68" y="777" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start" fill="#64748b" data-graph-role="label" data-graph-bounds="69.06,760.44,467.03999999999996,779.1">迁移准入：先完成一个可回退的受控执行试点</text>
<text x="68" y="807" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155" data-graph-role="label" data-graph-bounds="69.649,792.907,888.9299999999998,809.7370000000001">固定同一批输入、模型与参数，比较直接执行器和底座执行器；核验 schema、取消、费用、事件与结果归属。</text>
<text x="68" y="834" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155" data-graph-role="label" data-graph-bounds="68.527,819.992,843.6759999999997,836.737">保留 executorVersion；每个任务只能有一个循环和一个重试预算所有者，避免 DSH 与 SDK 层层重试。</text>
<text x="48" y="984" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#64748b" data-graph-role="label" data-graph-bounds="48.615,971.61,855.2400000000001,987.1800000000001">版本口径：DSH 0.1.5-rc.1；所检包 dsh-agent-loop 0.1.5-rc.2；AgentScope 为 Java 2.0.1，不混用 Python SDK 文档。</text>

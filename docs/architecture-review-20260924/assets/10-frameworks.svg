<text x="1022" y="306" font-family="PingFang SC,Helvetica Neue,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#334155" data-graph-role="decoration" data-graph-bounds="1022.765,291.924,1245.21,307.80199999999996">条件性核对：冲突 / 边界主张</text>
